name: Sandbox Integration Tests

# Issue #49 — runs end-to-end SDK tests against a local Soroban quickstart
# sandbox container with the real sorostream-contracts build deployed.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sandbox:
    name: Soroban sandbox e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      soroban-sandbox:
        image: stellar/quickstart:soroban-dev
        ports:
          - 8000:8000
        env:
          ENABLE_SOROBAN_RPC: "true"
          NETWORK: local
          PROTOCOL_VERSION: "21"
        options: >-
          --health-cmd "curl -sf http://localhost:8000/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 18

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Stellar CLI
        run: |
          curl -sSL https://raw.githubusercontent.com/stellar/stellar-cli/main/install.sh | bash
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Wait for sandbox RPC
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/soroban/rpc; then
              echo "RPC ready"
              break
            fi
            echo "Waiting for RPC... attempt $i"
            sleep 5
          done

      - name: Fund deployer account
        run: |
          stellar keys generate deployer --network local --rpc-url http://localhost:8000/soroban/rpc --network-passphrase "Standalone Network ; February 2017"
          stellar keys fund deployer --network local --rpc-url http://localhost:8000/soroban/rpc --network-passphrase "Standalone Network ; February 2017"

      - name: Checkout contracts
        uses: actions/checkout@v4
        with:
          repository: SoroStream/sorostream-contracts
          path: sorostream-contracts
          # Falls back gracefully if repo is private — sandbox tests are skipped
          token: ${{ secrets.CONTRACTS_TOKEN || '' }}

      - name: Build contracts
        if: hashFiles('sorostream-contracts/Cargo.toml') != ''
        run: |
          cd sorostream-contracts
          cargo build --target wasm32-unknown-unknown --release

      - name: Deploy contract
        if: hashFiles('sorostream-contracts/Cargo.toml') != ''
        id: deploy
        run: |
          WASM=$(find sorostream-contracts/target/wasm32-unknown-unknown/release -name "*.wasm" | head -1)
          CONTRACT_ID=$(stellar contract deploy \
            --wasm "$WASM" \
            --source deployer \
            --network local \
            --rpc-url http://localhost:8000/soroban/rpc \
            --network-passphrase "Standalone Network ; February 2017")
          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"

      - name: Run sandbox integration tests
        if: hashFiles('sorostream-contracts/Cargo.toml') != ''
        env:
          SOROBAN_RPC_URL: http://localhost:8000/soroban/rpc
          SOROBAN_NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
          SOROBAN_CONTRACT_ID: ${{ steps.deploy.outputs.contract_id }}
        run: npm run test:sandbox -- --reporter=verbose

      - name: Run unit tests (contracts unavailable)
        if: hashFiles('sorostream-contracts/Cargo.toml') == ''
        run: npm test
