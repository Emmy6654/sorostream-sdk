name: ESLint Plugin

on:
  pull_request:
    paths:
      - "packages/eslint-plugin/**"
      - ".github/workflows/eslint-plugin.yml"
  push:
    branches: [main]
    paths:
      - "packages/eslint-plugin/**"

jobs:
  test:
    name: Lint rule tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint -w packages/eslint-plugin

      - name: Run rule tests
        run: npx vitest run packages/eslint-plugin

      - name: Build
        run: npm run build -w packages/eslint-plugin
