name: Benchmarks

on:
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

jobs:
  bench:
    name: Latency benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Run benchmark suite
        run: npx vitest bench --reporter=verbose benchmarks/

      - name: Generate JSON report and check regression
        run: npx tsx benchmarks/report.ts

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmarks/report.json
          retention-days: 90
